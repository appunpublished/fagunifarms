<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stickman Duel</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      touch-action: none;
      background: #cdeffd;
      color: #172033;
      font-family: system-ui, sans-serif;
    }

    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }

    #backBtn {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 20;
      padding: 8px 14px;
      color: #1f2937;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(23, 32, 51, 0.22);
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(23, 32, 51, 0.14);
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
    }

    .hud {
      position: fixed;
      top: 14px;
      right: 14px;
      z-index: 18;
      display: flex;
      gap: 8px;
      align-items: center;
      max-width: calc(100vw - 132px);
      padding: 8px 10px;
      background: rgba(255, 255, 255, 0.88);
      border: 2px solid rgba(23, 32, 51, 0.22);
      border-radius: 8px;
      box-shadow: 0 6px 16px rgba(23, 32, 51, 0.14);
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .hud span {
      min-width: 60px;
      text-align: center;
    }

    .controls {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 12px;
      pointer-events: none;
    }

    .pad,
    .moves {
      display: grid;
      gap: 8px;
      pointer-events: auto;
    }

    .pad {
      grid-template-columns: repeat(3, 58px);
      grid-template-rows: repeat(3, 50px);
    }

    .moves {
      grid-template-columns: repeat(2, minmax(64px, 78px));
      align-content: end;
    }

    button.control {
      width: 100%;
      min-height: 50px;
      border: 2px solid rgba(23, 32, 51, 0.22);
      border-radius: 8px;
      color: #172033;
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 6px 14px rgba(23, 32, 51, 0.18);
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0;
      touch-action: none;
    }

    button.control:active,
    button.control.is-held {
      transform: translateY(2px);
      background: #fff4a8;
      box-shadow: 0 3px 8px rgba(23, 32, 51, 0.2);
    }

    .up { grid-column: 2; grid-row: 1; }
    .left { grid-column: 1; grid-row: 2; }
    .down { grid-column: 2; grid-row: 3; }
    .right { grid-column: 3; grid-row: 2; }
    .run { grid-column: 2; grid-row: 2; background: rgba(205, 255, 226, 0.9); }
    .punch { background: #ffe1d8; }
    .kick { background: #e3f3ff; }
    .block { background: #e9e4ff; }
    .special { background: #fff2bf; }

    .tip {
      position: fixed;
      left: 50%;
      top: 78px;
      z-index: 14;
      width: min(520px, calc(100vw - 28px));
      transform: translateX(-50%) translateY(-8px);
      padding: 9px 12px;
      color: #263044;
      background: rgba(255, 255, 255, 0.9);
      border: 2px solid rgba(23, 32, 51, 0.14);
      border-radius: 8px;
      opacity: 0;
      pointer-events: none;
      font-size: 14px;
      font-weight: 800;
      text-align: center;
      transition: opacity 180ms ease, transform 180ms ease;
    }

    .tip.is-visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 720px) {
      #backBtn {
        top: 8px;
        left: 8px;
        padding: 7px 10px;
        font-size: 13px;
      }

      .hud {
        top: 8px;
        right: 8px;
        gap: 4px;
        max-width: calc(100vw - 76px);
        padding: 6px;
        font-size: 11px;
        border-width: 1px;
      }

      .hud span {
        min-width: 0;
        padding: 0 4px;
      }

      .controls {
        padding: 6px;
        gap: 6px;
      }

      .pad {
        grid-template-columns: repeat(3, 44px);
        grid-template-rows: repeat(3, 40px);
        gap: 5px;
      }

      .moves {
        grid-template-columns: repeat(2, minmax(50px, 58px));
        gap: 5px;
      }

      button.control {
        min-height: 40px;
        font-size: 11px;
      }

      .tip {
        top: 48px;
        width: min(280px, calc(100vw - 92px));
        padding: 7px 9px;
        font-size: 11px;
        line-height: 1.25;
        background: rgba(255, 255, 255, 0.88);
        border-width: 1px;
        box-shadow: 0 4px 12px rgba(23, 32, 51, 0.12);
      }
    }
  </style>
</head>
<body>
  <a id="backBtn" href="games.html">Back</a>
  <div class="hud" aria-live="polite">
    <span id="scoreText">Score 0</span>
    <span id="waveText">Round 1</span>
    <span id="healthText">HP 100</span>
  </div>

  <canvas id="gameCanvas"></canvas>

  <div class="tip" id="tipText" role="status" aria-live="polite"></div>

  <div class="controls" aria-label="Game controls">
    <div class="pad">
      <button class="control up" data-control="up" aria-label="Jump">UP</button>
      <button class="control left" data-control="left" aria-label="Move left">LEFT</button>
      <button class="control run" data-control="run" aria-label="Run">RUN</button>
      <button class="control right" data-control="right" aria-label="Move right">RIGHT</button>
      <button class="control down" data-control="down" aria-label="Duck">DOWN</button>
    </div>

    <div class="moves">
      <button class="control punch" data-control="punch" aria-label="Punch">PUNCH</button>
      <button class="control kick" data-control="kick" aria-label="Kick">KICK</button>
      <button class="control block" data-control="block" aria-label="Block">BLOCK</button>
      <button class="control special" data-control="special" aria-label="Special attack">SPECIAL</button>
    </div>
  </div>

  <script src="stickman.js"></script>
</body>
</html>
